<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puppy Love</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; touch-action: none; }
  .ui {
    position: fixed; pointer-events: none; color: #ff5fa8;
    font: 12px Consolas, "Cascadia Mono", Menlo, monospace; letter-spacing: .18em;
  }
  #hint { left: 0; right: 0; bottom: 10px; text-align: center; opacity: .4; }
  #fps { left: 10px; top: 8px; opacity: .7; display: none; letter-spacing: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint" class="ui">click / tap / space to send more love &middot; F = fps</div>
<div id="fps" class="ui"></div>
<script>
'use strict';
(() => {
// ---------------------------------------------------------------------------
// Setup
// ---------------------------------------------------------------------------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const fpsEl = document.getElementById('fps');
const FONT_FAMILY = 'Consolas, "Cascadia Mono", Menlo, "DejaVu Sans Mono", "Courier New", monospace';

// Bloom chain: each canvas is half the size of the previous one (cheap box blur).
const bloom = [0, 1, 2, 3].map(() => document.createElement('canvas'));
const bloomCtx = bloom.map(c => c.getContext('2d'));

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const smooth = (a, b, x) => { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const pick = arr => arr[(Math.random() * arr.length) | 0];
function hash(a, b) {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// ---------------------------------------------------------------------------
// Palette: families x brightness levels, precomputed color strings
// ---------------------------------------------------------------------------
const BG = 0, RAIN = 1, HP = 2, HR = 3, HM = 4, PW = 5, PY = 6, PK = 7, SP = 8;
const BASE = [
  [150, 40, 175],  // BG   dim violet-magenta
  [255, 60, 150],  // RAIN pink rain
  [255, 105, 185], // HP   heart pink
  [255, 40, 80],   // HR   heart red
  [240, 50, 235],  // HM   heart magenta
  [255, 246, 228], // PW   puppy warm white
  [255, 212, 120], // PY   puppy soft yellow
  [255, 178, 205], // PK   puppy light pink
  [255, 236, 250], // SP   sparkle
];
const LV = 20;
const PALS = [];
for (const [r, g, b] of BASE) {
  for (let l = 0; l < LV; l++) {
    const x = (l + 1) / LV;
    const k = 0.05 + 0.95 * Math.pow(x, 1.15);
    const w = Math.max(0, x - 0.8) * 1.1; // push toward white at the top end
    PALS.push(`rgb(${Math.min(255, r * k + 255 * w) | 0},${Math.min(255, g * k + 255 * w) | 0},${Math.min(255, b * k + 255 * w) | 0})`);
  }
}

// ---------------------------------------------------------------------------
// Characters
// ---------------------------------------------------------------------------
const codes = s => Array.from(s).map(ch => ch.codePointAt(0));
const C = s => s.codePointAt(0);
const SPACE = 32, HEART = 0x2665, DOT = 0xB7, STAR = C('*');
const FUR = codes('.:-=+*x%#@');
const HEX = codes('0123456789ABCDEF');
const RAINC = codes('01<3>{}[]=+*#$%&ABCDEF\u2665love');
const FLOW = codes('\u00B7.:-~=');
const SPARKC = codes('*+\u00B7.\u00B0\'');
const MSG = codes('\u2665 I LOVE YOU \u2665 sending you hugs \u2665 you are so loved \u2665 woof woof ');
const WORDS = ['<3', 'love', '\u2665', 'xoxo', 'hug'].map(codes);
const LOVE_MSG = codes('Love you nakub');
const chCache = [];
const chOf = c => chCache[c] || (chCache[c] = String.fromCodePoint(c));

const E_TOP = C('-'), E_BOT = C('_'), E_V = C('|'), E_SL = C('/'), E_BS = C('\\');
// Pick a line character that follows an outline, given its normal (screen y points down).
function edgeCode(nx, ny) {
  const ax = Math.abs(nx), ay = Math.abs(ny);
  if (ay > 2.2 * ax) return ny > 0 ? E_BOT : E_TOP;
  if (ax > 2.2 * ay) return E_V;
  return nx * ny > 0 ? E_SL : E_BS;
}

// ---------------------------------------------------------------------------
// Character grid (typed arrays, one entry per cell)
// ---------------------------------------------------------------------------
let W = 0, H = 0, DPR = 1, FS = 14, CW = 8, CH = 14, COLS = 0, ROWS = 0, NC = 0, FONT = '';
let CODE, PALI, BRI, PRI, ORDER;
const COUNTS = new Int32Array(PALS.length + 1);
let R = 100, OX = 0, OY = 0; // puppy scale (px per unit) and origin
let drops = [];
let ring = null;
let vignette = null;

function put(i, code, fam, b, pr) {
  if (pr > PRI[i] || (pr === PRI[i] && b > BRI[i])) {
    PRI[i] = pr; BRI[i] = b; CODE[i] = code;
    let l = (b * LV) | 0;
    if (l < 0) l = 0; else if (l >= LV) l = LV - 1;
    PALI[i] = fam * LV + l;
  }
}
function putPx(x, y, code, fam, b, pr) {
  const c = Math.floor(x / CW), r = Math.floor(y / CH);
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return;
  put(r * COLS + c, code, fam, b, pr);
}
function putCR(c, r, code, fam, b, pr) {
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return;
  put(r * COLS + c, code, fam, b, pr);
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.max(1, (W * DPR) | 0);
  cv.height = Math.max(1, (H * DPR) | 0);

  R = Math.min(H * 0.17, W * 0.22);
  FS = clamp(R / 10.5, 7, 30);
  FONT = `${FS.toFixed(2)}px ${FONT_FAMILY}`;
  ctx.font = FONT;
  CW = Math.max(4, ctx.measureText('M').width);
  CH = FS;
  COLS = Math.ceil(W / CW); ROWS = Math.ceil(H / CH); NC = COLS * ROWS;
  CODE = new Uint16Array(NC); PALI = new Uint16Array(NC);
  BRI = new Float32Array(NC); PRI = new Int8Array(NC); ORDER = new Int32Array(NC);

  OX = W * 0.5;
  OY = H - 2.72 * R - H * 0.06;

  let bw = cv.width, bh = cv.height;
  for (const b of bloom) { bw = Math.max(1, bw >> 1); bh = Math.max(1, bh >> 1); b.width = bw; b.height = bh; }

  vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.hypot(W, H) * 0.6);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.65)');

  drops = [];
  for (let c = 0; c < COLS; c++) drops.push(newDrop(true));
  buildRing();
}

// ---------------------------------------------------------------------------
// Animation state, driven by time t
// ---------------------------------------------------------------------------
const A = { bodyY: 0, headY: 0, tilt: 0, earL: 0.3, earR: 0.3, open: 1, happy: 0, wag: 0, beat: 0, hs: 0.4, tail: new Float32Array(14) };
let lastSend = -10, nextAuto = 2.2, nextSmall = 0, nextWord = 1.5;

function updateAnim(t) {
  const hp = t - lastSend;
  const happy = hp >= 0 && hp < 1.8 ? Math.sin((hp / 1.8) * Math.PI) : 0;
  A.happy = happy;
  A.bodyY = 0.03 * Math.sin(t * 2.1) - 0.06 * happy * Math.abs(Math.sin(t * 9));
  A.headY = 0.05 * Math.sin(t * 2.1 - 0.8) + A.bodyY * 0.5;
  A.tilt = 0.09 * Math.sin(t * 0.75) + 0.035 * Math.sin(t * 1.9);
  A.earL = 0.42 + 0.1 * Math.sin(t * 3.2) + happy * 0.22 * (0.6 + 0.4 * Math.sin(t * 14));
  A.earR = 0.42 + 0.1 * Math.sin(t * 3.2 + 1.3) + happy * 0.22 * (0.6 + 0.4 * Math.sin(t * 14 + 1));

  // blinking: one blink every 4.3 s, a double blink every third cycle
  const cyc = Math.floor(t / 4.3), bp = t - cyc * 4.3;
  let open = 1;
  if (bp < 0.18) open = Math.abs(Math.cos((bp / 0.18) * Math.PI));
  else if (cyc % 3 === 1 && bp > 0.3 && bp < 0.48) open = Math.abs(Math.cos(((bp - 0.3) / 0.18) * Math.PI));
  A.open = open;

  // tail: a chain of segments that curls upward and wags
  A.wag = Math.sin(t * (7 + 7 * happy)) * (0.5 + 0.3 * happy);
  let x = 0.95, y = 2.15, ang = -0.15;
  A.tail[0] = x; A.tail[1] = y;
  for (let i = 1; i < 7; i++) {
    ang += -0.25 + A.wag * 0.17;
    x += 0.11 * Math.cos(ang); y += 0.11 * Math.sin(ang);
    A.tail[2 * i] = x; A.tail[2 * i + 1] = y;
  }

  // heartbeat (lub-dub)
  const p = (t * 1.15) % 1;
  A.beat = Math.exp(-(((p - 0.08) * 14) ** 2)) + 0.6 * Math.exp(-(((p - 0.3) * 14) ** 2));
  A.hs = 0.46 * (1 + 0.09 * A.beat + 0.12 * happy);
}

// ---------------------------------------------------------------------------
// Shape helpers
// ---------------------------------------------------------------------------
let EU = 0, EV = 0, EK = 0, ED = 0; // results of ell()
function ell(x, y, cx, cy, rx, ry) {
  const dx = x - cx, dy = y - cy;
  EU = dx / rx; EV = dy / ry; EK = Math.sqrt(EU * EU + EV * EV);
  ED = Math.sqrt(dx * dx + dy * dy) * (1 - 1 / Math.max(EK, 1e-6)); // approx signed distance
  return EK < 1;
}
const L3 = (() => { const v = [-0.45, -0.6, 0.66], l = Math.hypot(...v); return v.map(a => a / l); })();
function sphereShade(u, v, k) {
  const z = Math.sqrt(Math.max(0, 1 - k * k));
  const d = (u * L3[0] + v * L3[1] + z * L3[2]) / Math.sqrt(u * u + v * v + z * z + 1e-9);
  return 0.28 + 0.72 * Math.max(0, d);
}
// Exact heart SDF (after Inigo Quilez), remapped so the heart spans about [-1,1] in u, v points down.
function sdHeart(u, v) {
  const x = Math.abs(u) * 0.6, y = 0.55 - v * 0.6;
  let d;
  if (y + x > 1.0) {
    const dx = x - 0.25, dy = y - 0.75;
    d = Math.sqrt(dx * dx + dy * dy) - 0.35355339;
  } else {
    const ay = y - 1.0, d1 = x * x + ay * ay;
    const m = 0.5 * Math.max(x + y, 0), bx = x - m, by = y - m, d2 = bx * bx + by * by;
    d = Math.sqrt(Math.min(d1, d2)) * Math.sign(x - y);
  }
  return d / 0.6;
}

// Per-cell output of the puppy shader
let oC = 0, oF = -1, oB = 0, oEdge = false, cc = 0, cr = 0;
function furCode(s) {
  const n = FUR.length;
  let i = (s * n + (hash(cc, cr) - 0.5) * 1.6) | 0;
  return FUR[i < 0 ? 0 : i >= n ? n - 1 : i];
}
// Outline thickness along a normal, so lines come out about one cell thick in any direction.
function band(nx, ny) {
  const l = Math.sqrt(nx * nx + ny * ny) + 1e-9;
  return (CH * Math.abs(ny) + CW * Math.abs(nx)) / (R * l) * 0.85;
}
function fillShape(fam, rx, ry, d, u, v, k, bw, bright, edgeFam) {
  if (d > -bw && d > -band(u / rx, v / ry)) { oC = edgeCode(u / rx, v / ry); oF = edgeFam; oB = 0.92 * bright; oEdge = true; return; }
  const s = sphereShade(u, v, k) * bright;
  oC = furCode(s); oF = fam; oB = s; oEdge = false;
}

// ---------------------------------------------------------------------------
// Puppy
// ---------------------------------------------------------------------------
function drawPuppy(t) {
  const bw = (CH / R) * 0.95;
  const x0 = Math.max(0, Math.floor((OX - 2.0 * R) / CW)), x1 = Math.min(COLS - 1, Math.ceil((OX + 2.0 * R) / CW));
  const y0 = Math.max(0, Math.floor((OY - 1.5 * R) / CH)), y1 = Math.min(ROWS - 1, Math.ceil((OY + 2.65 * R) / CH));
  const ct = Math.cos(A.tilt), st = Math.sin(A.tilt);
  const hs = A.hs, happy = A.happy, open = A.open, tail = A.tail;
  const bsq = 1 + 0.02 * Math.sin(t * 2.1);
  const bright = 0.88;
  const eyesClosed = happy > 0.45 || open < 0.3;

  for (let r = y0; r <= y1; r++) {
    const ly = (r * CH + CH * 0.5 - OY) / R;
    for (let c = x0; c <= x1; c++) {
      const lx = (c * CW + CW * 0.5 - OX) / R;
      const i = r * COLS + c;
      cc = c; cr = r; oF = -1; oEdge = false;
      let erase = false;
      const bx = lx, by = ly - A.bodyY;
      const side = bx < 0 ? -1 : 1;

      // --- tail (behind body)
      if (bx > 0.7 && bx < 1.7 && by > 1.3 && by < 2.4) {
        let best = 1e9, nx = 0, ny = 0;
        for (let j = 0; j < 6; j++) {
          const ax = tail[2 * j], ay = tail[2 * j + 1];
          const vx = tail[2 * j + 2] - ax, vy = tail[2 * j + 3] - ay;
          const wx = bx - ax, wy = by - ay;
          const h = clamp((wx * vx + wy * vy) / (vx * vx + vy * vy), 0, 1);
          const dx = wx - vx * h, dy = wy - vy * h;
          const d = Math.sqrt(dx * dx + dy * dy) - (0.115 - 0.009 * (j + h));
          if (d < best) { best = d; nx = dx; ny = dy; }
        }
        if (best < 0) {
          if (best > -band(nx, ny)) { oC = edgeCode(nx, ny); oF = PW; oB = 0.9 * bright; oEdge = true; }
          else { oC = furCode(0.75); oF = PY; oB = 0.7 * bright; }
        }
      }

      // --- body + haunches
      {
        const inB = ell(bx, by, 0, 1.5, 0.9, 0.95 * bsq);
        const dB = ED, uB = EU, vB = EV, kB = EK;
        const inQ = ell(bx, by, side * 0.68, 2.02, 0.4, 0.45);
        const dQ = ED, uQ = EU, vQ = EV, kQ = EK;
        const inF = ell(bx, by, side * 0.55, 2.43, 0.3, 0.14);
        if (inB || inQ || inF) {
          if (dB <= dQ && dB <= ED) fillShape(PY, 0.9, 0.95 * bsq, dB, uB, vB, kB, bw, bright, PW);
          else if (dQ <= ED) fillShape(PY, 0.4, 0.45, dQ, uQ, vQ, kQ, bw, bright, PW);
          else fillShape(PW, 0.3, 0.14, ED, EU, EV, EK, bw, bright, PW);
          if (inF && !oEdge) oF = PW; // hind feet
        }
      }
      if (oF === PY && ell(bx, by, 0, 1.62, 0.5, 0.62)) oF = PW; // chest patch
      // warm pink glow from the held heart onto the chest
      if ((oF === PY || oF === PW) && !oEdge && bx * bx + (by - 1.5) * (by - 1.5) < 0.5) oF = PK;

      // --- the held heart
      const hu = bx / hs, hv = (by - 1.5) / hs;
      if (hu > -1.15 && hu < 1.15 && hv > -1.1 && hv < 1.1) {
        const d = sdHeart(hu, hv);
        if (d < 0) {
          let edge = false;
          if (d * hs > -bw) {
            const e = 0.03;
            const gx = sdHeart(hu + e, hv) - sdHeart(hu - e, hv), gy = sdHeart(hu, hv + e) - sdHeart(hu, hv - e);
            if (d * hs > -band(gx, gy)) { oC = edgeCode(gx, gy); oF = HP; oB = 1; oEdge = edge = true; }
          }
          if (!edge) {
            const shimmer = Math.sin(hu * 2.5 + hv * 1.5 - t * 5);
            const hl = (hu + 0.45) * (hu + 0.45) + (hv + 0.4) * (hv + 0.4) < 0.025;
            oC = hl ? STAR : HEART;
            oF = hl || shimmer > 0.9 ? SP : (d * hs > -bw * 2.2 ? HM : HR);
            oB = 0.78 + 0.22 * A.beat; oEdge = true;
          }
        }
      }

      // --- paws resting on the heart
      if (ell(bx, by, side * 0.44, 1.62, 0.18, 0.14)) fillShape(PW, 0.18, 0.14, ED, EU, EV, EK, bw, bright, PW);

      // --- head (rotated head space)
      const px = lx, py = ly + 0.2 - A.headY;
      const qx = px * ct + py * st, qy = -px * st + py * ct;
      const qs = qx < 0 ? -1 : 1;
      let inHead = false;
      if (qy > -1.3 && qy < 1.0) {
        const inH = ell(qx, qy, 0, 0, 1.1, 0.92);
        const dH = ED, uH = EU, vH = EV, kH = EK;
        const inK = ell(qx, qy, qs * 0.42, 0.28, 0.62, 0.52);
        if (inH || inK) {
          inHead = true;
          if (dH < ED) fillShape(PY, 1.1, 0.92, dH, uH, vH, kH, bw, bright, PW);
          else fillShape(PY, 0.62, 0.52, ED, EU, EV, EK, bw, bright, PW);
          if (!oEdge) {
            // forehead blaze and muzzle in warm white
            if (ell(qx, qy, 0, -0.3, 0.13, 0.42)) oF = PW;
            if (ell(qx, qy, 0, 0.33, 0.44, 0.3)) {
              const s = Math.min(1, sphereShade(EU, EV, EK) * bright * 1.08);
              oC = furCode(s); oF = PW; oB = s;
            }
            // blushing cheeks ///
            if (ell(qx, qy, qs * 0.64, 0.2, 0.16, 0.09)) { oC = E_SL; oF = HP; oB = 0.65 + 0.35 * happy; oEdge = true; }
          }
        }
        // --- floppy ears (in front of the head)
        if (Math.abs(qx) > 0.35) {
          const a = qs < 0 ? A.earL : A.earR;
          const dirx = qs * Math.sin(a), diry = Math.cos(a);
          const ex = qx - qs * 0.88, ey = qy + 0.55;
          const along = ex * dirx + ey * diry, across = -ex * diry + ey * dirx;
          if (ell(across, along, 0, 0.58, 0.28, 0.68)) {
            const nA = EU / 0.28, nL = EV / 0.68;
            const enx = -nA * diry + nL * dirx, eny = nA * dirx + nL * diry;
            if (ED > -band(enx, eny)) {
              oC = edgeCode(enx, eny); oF = PK; oB = 0.9 * bright; oEdge = true;
            } else {
              const s = 0.45 + 0.55 * sphereShade(EU, EV, EK) * bright;
              oC = hash(c, r) < 0.3 ? (qs < 0 ? E_BS : E_SL) : furCode(s); oF = PK; oB = s; oEdge = false;
            }
          }
        }
        // --- eyes and nose are dark holes; line art is stamped afterwards
        const eX = qs * 0.4, eY = -0.12;
        if (!eyesClosed) { if (ell(qx, qy, eX, eY, 0.175, 0.23 * open)) erase = true; }
        else if (ell(qx, qy, eX, eY + 0.02, 0.2, 0.12)) erase = true;
        if (ell(qx, qy, 0, 0.13, 0.16, 0.11)) erase = true;
      }

      if (erase) { put(i, SPACE, 0, 1, 6); continue; }
      if (oF < 0) continue;
      // a sweeping band of "code" across the fur
      if (!oEdge && !inHead && Math.sin(lx * 2.4 + ly * 1.7 - t * 2.6) > 0.965) {
        oC = HEX[(hash(c, r + ((t * 10) | 0)) * 16) | 0];
        oB = Math.min(1, oB + 0.2);
      }
      put(i, oC, oF, oB, 3);
    }
  }

  // --- face line art, stamped onto the grid at the feature centres
  const stamp = (hx, hy, str, fam, b, pr = 7) => {
    const pX = hx * ct - hy * st, pY = hx * st + hy * ct;
    const sx = OX + pX * R, sy = OY + (pY - 0.2 + A.headY) * R;
    const col = Math.floor(sx / CW), row = Math.floor(sy / CH);
    const cs = codes(str), start = col - (cs.length >> 1);
    for (let k = 0; k < cs.length; k++) if (cs[k] !== SPACE) putCR(start + k, row, cs[k], fam, b, pr);
  };
  const rowH = CH / R;
  for (const s of [-1, 1]) {
    const ex = s * 0.4, ey = -0.12;
    if (happy > 0.45) {            // happy squint  ^ ^
      stamp(ex, ey - rowH, '__', HP, 1);
      stamp(ex, ey, '/  \\', HP, 1);
    } else if (open < 0.3) {       // blink
      stamp(ex, ey, '-==-', PW, 0.9);
    } else {                       // sparkle in the eye
      stamp(ex - 0.06, ey - rowH * 0.9 * open, 'o', PW, 1);
      if (open > 0.7) stamp(ex + 0.06, ey + rowH, '.', PW, 0.6);
    }
  }
  stamp(-0.04, 0.14 - rowH * 0.4, '\'', PW, 0.55);
  stamp(0, 0.14 + 2 * rowH, '\\_^_/', HR, 0.95);
  stamp(0, 0.14 + 3 * rowH, happy > 0.3 ? 'U' : 'u', HP, 0.85 + 0.15 * happy);
}

// ---------------------------------------------------------------------------
// Floating hearts, words and sparkles
// ---------------------------------------------------------------------------
const hearts = [], sparks = [];
const heartPos = () => [OX, OY + (1.5 + A.bodyY) * R];

function addHeart(o) {
  if (hearts.length > 180) return;
  hearts.push(Object.assign({
    vx: 0, vy: 0, age: 0, rot: 0, vr: 0, spin: 0, spinV: 0, fam: HR, ph: rand(0, 6.28),
    wob: 0, wf: 1, grow: 0, word: null, buoy: 0.1, behind: false,
  }, o));
}
function spawnSmall() {
  const [hx, hy] = heartPos();
  const side = Math.random() < 0.5 ? -1 : 1;
  addHeart({
    x: hx + side * rand(0.05, 0.35) * R, y: hy - 0.2 * R,
    vx: side * rand(0.45, 0.95) * R, vy: -rand(0.35, 0.65) * R, behind: true,
    s: rand(0.05, 0.22) * R * (Math.random() < 0.15 ? 1.6 : 1), life: rand(3, 5.5),
    rot: rand(-0.3, 0.3), vr: rand(-0.9, 0.9), spin: rand(0, 6.28),
    spinV: Math.random() < 0.4 ? rand(1.5, 3.5) : 0,
    fam: pick([HP, HR, HM]), wob: rand(0.04, 0.18) * R, wf: rand(0.8, 2.2), grow: rand(0, 0.8),
  });
}
function spawnWord() {
  const [hx, hy] = heartPos();
  const side = Math.random() < 0.5 ? -1 : 1;
  addHeart({
    x: hx + side * rand(1.3, 1.9) * R, y: hy - rand(0, 0.6) * R, vx: side * rand(0.05, 0.2) * R, behind: true,
    vy: -rand(0.25, 0.45) * R, s: 0, life: rand(3, 4.5), fam: pick([HP, HM, SP]),
    wob: 0.08 * R, wf: 1.3, word: pick(WORDS),
  });
}
function spawnSpark(x, y, spd, fam) {
  if (sparks.length > 400) return;
  const a = rand(0, 6.283), v = rand(0.2, 1) * spd;
  sparks.push({
    x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - spd * 0.2, age: 0, life: rand(0.5, 1.4),
    code: pick(SPARKC), fam: fam ?? pick([SP, HP, PY, HM]), ph: rand(0, 6.28),
  });
}
function sendLove(t, cx, cy) {
  lastSend = t;
  const [hx, hy] = heartPos();
  // one big heart rising above the puppy's head, toward the viewer
  const big = { x: OX, y: OY - 1.3 * R, vy: -0.3 * R, life: 2.8, wob: 0.04 * R, wf: 1.4, buoy: 0.02, ph: rand(0, 6.28) };
  addHeart(Object.assign({ s: 0.24 * R, grow: 1.6, fam: HR }, big));
  // the message rides in the middle of the big heart (same motion, drawn on top)
  addHeart(Object.assign({ s: 0, fam: SP, word: LOVE_MSG, top: true }, big));
  for (let k = 0; k < 12; k++) {
    const a = -Math.PI / 2 + pick([-1, 1]) * rand(0.7, 1.4), v = rand(0.6, 1.4) * R;
    addHeart({ x: hx, y: hy - 0.3 * R, behind: true, vx: Math.cos(a) * v, vy: Math.sin(a) * v, s: rand(0.05, 0.12) * R,
      life: rand(1.6, 2.8), vr: rand(-2, 2), fam: pick([HP, HR, HM]), wob: 0.05 * R, wf: 2 });
  }
  for (let k = 0; k < 26; k++) spawnSpark(hx, hy - 0.3 * R, 0.9 * R);
  if (cx !== undefined) {
    for (let k = 0; k < 9; k++) {
      const a = rand(0, 6.283), v = rand(0.3, 0.9) * R;
      addHeart({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.3 * R, s: rand(0.05, 0.16) * R,
        life: rand(1.4, 2.6), vr: rand(-2, 2), fam: pick([HP, HR, HM]), wob: 0.05 * R, wf: 2 });
    }
    for (let k = 0; k < 20; k++) spawnSpark(cx, cy, 0.8 * R);
    addHeart({ x: cx, y: cy, vy: -0.25 * R, life: 2.6, fam: SP, word: LOVE_MSG, top: true, wob: 0.03 * R, wf: 1.2, buoy: 0.02 });
  }
}

function updateParticles(t, dt) {
  // continuous stream from the held heart
  if (t > nextSmall) { spawnSmall(); nextSmall = t + rand(0.12, 0.3); }
  if (t > nextWord) { spawnWord(); nextWord = t + rand(1.4, 2.6); }
  if (t > nextAuto) { sendLove(t); nextAuto = t + rand(4.5, 6.5); }
  // ambient twinkles in an aura around the puppy
  let n = dt * 22;
  while (n > 0) {
    if (Math.random() < n) {
      const a = rand(0, 6.283), rr = rand(1.4, 2.4);
      const s = { x: OX + Math.cos(a) * rr * 1.1 * R, y: OY + 0.6 * R + Math.sin(a) * rr * 0.95 * R };
      spawnSpark(s.x, s.y, 0.08 * R, pick([SP, HP, PY]));
      sparks[sparks.length - 1].life = rand(1, 2.5);
    }
    n -= 1;
  }

  for (let k = hearts.length - 1; k >= 0; k--) {
    const h = hearts[k];
    h.age += dt;
    h.vy -= h.buoy * R * dt;
    h.vx *= Math.exp(-0.6 * dt);
    h.x += (h.vx + Math.cos(t * h.wf + h.ph) * h.wob) * dt;
    h.y += h.vy * dt;
    h.rot += h.vr * dt; h.spin += h.spinV * dt;
    if (h.age > h.life || h.y < -R) {
      if (!h.word) for (let j = 0; j < 4; j++) spawnSpark(h.x, h.y, 0.4 * R, h.fam === HR ? HP : h.fam);
      hearts[k] = hearts[hearts.length - 1]; hearts.pop();
    }
  }
  for (let k = sparks.length - 1; k >= 0; k--) {
    const s = sparks[k];
    s.age += dt;
    const damp = Math.exp(-1.5 * dt);
    s.vx *= damp; s.vy = s.vy * damp - 0.05 * R * dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.age > s.life) { sparks[k] = sparks[sparks.length - 1]; sparks.pop(); }
  }
}

function drawHeartParticle(h, t) {
  const f = h.age / h.life;
  const b0 = smooth(0, 0.08, f) * (1 - smooth(0.55, 1, f));
  if (b0 < 0.03) return;
  const pr = h.top ? 8 : b0 > 0.3 && !h.behind ? 7 : 2;

  if (h.word) {
    const col = Math.floor(h.x / CW) - (h.word.length >> 1), row = Math.floor(h.y / CH);
    for (let k = 0; k < h.word.length; k++) putCR(col + k, row, h.word[k], h.fam, b0 * 0.9, pr);
    return;
  }
  const S = h.s * (0.35 + 0.65 * smooth(0, 0.15, f)) * (1 + h.grow * f) *
            (1 - 0.6 * smooth(0.75, 1, f)) * (1 + 0.08 * Math.sin(t * 6 + h.ph));
  if (S < CH * 0.75) { putPx(h.x, h.y, HEART, h.fam, b0, pr); return; }

  const cr_ = Math.cos(h.rot), sr_ = Math.sin(h.rot);
  const sx = Math.max(0.18, Math.abs(Math.cos(h.spin))); // spinning like a coin
  const ext = S * 1.3, inv = 1 / S, edgeW = CH, glowW = CH * 1.3;
  const edgeFam = h.fam === HP ? SP : HP;
  const c0 = Math.max(0, Math.floor((h.x - ext) / CW)), c1 = Math.min(COLS - 1, Math.floor((h.x + ext) / CW));
  const r0 = Math.max(0, Math.floor((h.y - ext) / CH)), r1 = Math.min(ROWS - 1, Math.floor((h.y + ext) / CH));
  for (let r = r0; r <= r1; r++) {
    const dy = (r * CH + CH * 0.5 - h.y) * inv;
    for (let c = c0; c <= c1; c++) {
      const dx = (c * CW + CW * 0.5 - h.x) * inv;
      const u = (dx * cr_ + dy * sr_) / sx, v = -dx * sr_ + dy * cr_;
      if (u < -1.4 || u > 1.4 || v < -1.3 || v > 1.3) continue;
      const d = sdHeart(u, v), dpx = d * S * sx;
      const i = r * COLS + c;
      if (d < 0) {
        if (dpx > -edgeW) {
          const e = 0.03;
          const gu = sdHeart(u + e, v) - sdHeart(u - e, v), gv = sdHeart(u, v + e) - sdHeart(u, v - e);
          put(i, edgeCode((gu * cr_) / sx - gv * sr_, (gu * sr_) / sx + gv * cr_), edgeFam, b0, pr);
        } else {
          const hl = (u + 0.45) * (u + 0.45) + (v + 0.3) * (v + 0.3) < 0.07;
          put(i, hl ? STAR : HEART, hl ? SP : h.fam, b0 * (hl ? 1 : 0.9), pr);
        }
      } else if (dpx < glowW) {
        put(i, DOT, h.fam, b0 * 0.28 * (1 - dpx / glowW), 2);
      }
    }
  }
}

function drawParticles(t) {
  for (const h of hearts) drawHeartParticle(h, t);
  for (const s of sparks) {
    const f = s.age / s.life;
    const b = (1 - f) * smooth(0, 0.1, f) * (0.6 + 0.4 * Math.sin(t * 16 + s.ph));
    if (b > 0.04) putPx(s.x, s.y, s.code, s.fam, b, 2);
  }
}

// ---------------------------------------------------------------------------
// Background: flowing wave field, pulse rings, digital rain
// ---------------------------------------------------------------------------
function drawBackground(t) {
  const [hx, hy] = heartPos();
  const invR = 1 / R;
  for (let r = 0; r < ROWS; r++) {
    const y = r * CH + CH * 0.5;
    const sr = Math.sin(r * 0.11 - t * 0.7);
    const dyR = (y - hy) * invR;
    for (let c = 0; c < COLS; c++) {
      const i = r * COLS + c;
      const dxR = (c * CW + CW * 0.5 - hx) * invR;
      const d = Math.sqrt(dxR * dxR * 0.6 + dyR * dyR);
      const w = Math.sin(c * 0.065 + t * 0.45) + sr + Math.sin(c * 0.035 + r * 0.075 + t * 0.31) +
                0.6 * Math.sin(d * 2.2 - t * 1.1);
      if (w > 2.2) {
        const code = FLOW[(hash(c, r * 977 + ((t * 2 + hash(r, c) * 4) | 0)) * FLOW.length) | 0];
        put(i, code, BG, 0.05 + ((w - 2.2) / 1.4) * 0.3, 0);
      }
      if (d > 1.0 && d < 4.5) {
        const ring = Math.sin(d * 3.2 - t * 2.6);
        if (ring > 0.94) put(i, DOT, HM, ((ring - 0.94) / 0.06) * 0.3 * (1 - (d - 1) / 3.5), 1);
      }
    }
  }
}

function newDrop(init) {
  return { y: init ? rand(-ROWS, ROWS) : rand(-ROWS * 0.7, -2), sp: rand(6, 18), len: (rand(5, 18)) | 0, z: rand(0.3, 1) };
}
function drawRain(t, dt) {
  for (let c = 0; c < COLS; c++) {
    const d = drops[c];
    d.y += d.sp * d.z * dt;
    if (d.y - d.len > ROWS) drops[c] = newDrop(false);
    const head = Math.floor(d.y);
    for (let k = 0; k < d.len; k++) {
      const r = head - k;
      if (r < 0) break;
      if (r >= ROWS) continue;
      const fade = 1 - k / d.len;
      const b = (k === 0 ? 0.55 : 0.3 * fade * fade) * d.z;
      if (b < 0.03) continue;
      const code = RAINC[(hash(c * 31 + r, (t * (k === 0 ? 14 : 3) + hash(c, r) * 9) | 0) * RAINC.length) | 0];
      put(r * COLS + c, code, k === 0 ? SP : RAIN, b, 0);
    }
  }
}

// ---------------------------------------------------------------------------
// Orbiting ring of text around the puppy (front half in front, back half behind)
// ---------------------------------------------------------------------------
function buildRing() {
  const rx = 2.0 * R, ry = 0.3 * R, M = 512;
  const cum = new Float32Array(M + 1);
  let s = 0, px = rx, py = 0;
  for (let j = 1; j <= M; j++) {
    const th = (j / M) * Math.PI * 2, x = rx * Math.cos(th), y = ry * Math.sin(th);
    s += Math.hypot(x - px, y - py); cum[j] = s; px = x; py = y;
  }
  const k = Math.max(1, Math.floor(s / (CW * 1.05 * MSG.length)));
  ring = { rx, ry, M, cum, P: s, n: k * MSG.length };
}
const ringFront = [];
function drawRing(t) {
  ringFront.length = 0;
  const { rx, ry, M, cum, P, n } = ring;
  const cx = OX, cy = OY + (2.34 + 0.03 * Math.sin(t * 0.9)) * R;
  const off = (((-t * 0.035) % 1) + 1) % 1;
  for (let i = 0; i < n; i++) {
    const code = MSG[i % MSG.length];
    if (code === SPACE) continue;
    const s = ((i / n + off) % 1) * P;
    let lo = 1, hi = M;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (cum[mid] < s) lo = mid + 1; else hi = mid; }
    const th = -((lo - 1 + (s - cum[lo - 1]) / (cum[lo] - cum[lo - 1] + 1e-9)) / M) * Math.PI * 2;
    const front = Math.sin(th);
    const depth = 0.5 + 0.5 * front;
    const b = (0.12 + 0.68 * depth * depth) * (0.85 + 0.15 * Math.sin(t * 5 - i * 0.5));
    const x = cx + rx * Math.cos(th), y = cy + ry * front, fam = code === HEART ? HR : HM;
    if (front > 0.05) {
      putPx(x, y, SPACE, 0, 1, 8); // clear the cell underneath
      ringFront.push(x, y, code, fam * LV + Math.min(LV - 1, (b * LV) | 0));
    } else putPx(x, y, code, fam, b, 2);
  }
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function renderGrid() {
  const NP = PALS.length;
  COUNTS.fill(0);
  for (let i = 0; i < NC; i++) if (CODE[i] !== SPACE && BRI[i] >= 0.035) COUNTS[PALI[i] + 1]++;
  for (let p = 1; p <= NP; p++) COUNTS[p] += COUNTS[p - 1]; // prefix sums -> bucket starts
  const fillPos = COUNTS.slice();
  for (let i = 0; i < NC; i++) if (CODE[i] !== SPACE && BRI[i] >= 0.035) ORDER[fillPos[PALI[i]]++] = i;

  ctx.font = FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const hw = CW * 0.5, hh = CH * 0.5;
  for (let p = 0; p < NP; p++) {
    const a = COUNTS[p], b = COUNTS[p + 1];
    if (a === b) continue;
    ctx.fillStyle = PALS[p];
    for (let j = a; j < b; j++) {
      const i = ORDER[j], c = i % COLS, r = (i - c) / COLS;
      ctx.fillText(chOf(CODE[i]), c * CW + hw, r * CH + hh);
    }
  }
}

function bloomPass() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  let src = cv;
  for (let k = 0; k < bloom.length; k++) {
    const b = bloom[k], bc = bloomCtx[k];
    bc.globalCompositeOperation = 'copy';
    bc.imageSmoothingEnabled = true;
    bc.drawImage(src, 0, 0, src.width, src.height, 0, 0, b.width, b.height);
    src = b;
  }
  ctx.imageSmoothingEnabled = true;
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.45; ctx.drawImage(bloom[1], 0, 0, cv.width, cv.height);
  ctx.globalAlpha = 0.6;  ctx.drawImage(bloom[3], 0, 0, cv.width, cv.height);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

let last = performance.now(), fpsAcc = 0, fpsN = 0, showFps = false, tNow = 0;
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  const t = (tNow += dt);

  CODE.fill(SPACE); PRI.fill(-1); BRI.fill(0);
  updateAnim(t);
  updateParticles(t, dt);
  drawBackground(t);
  drawRain(t, dt);
  drawRing(t);
  drawPuppy(t);
  drawParticles(t);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  renderGrid();
  for (let k = 0; k < ringFront.length; k += 4) {
    ctx.fillStyle = PALS[ringFront[k + 3]];
    ctx.fillText(chOf(ringFront[k + 2]), ringFront[k], ringFront[k + 1]);
  }
  bloomPass();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);

  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) { if (showFps) fpsEl.textContent = `${(fpsN / fpsAcc).toFixed(0)} fps · ${COLS}x${ROWS} cells`; fpsAcc = 0; fpsN = 0; }
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
cv.addEventListener('pointerdown', e => sendLove(tNow, e.clientX, e.clientY));
window.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') { showFps = !showFps; fpsEl.style.display = showFps ? 'block' : 'none'; }
  if (e.key === ' ') { e.preventDefault(); sendLove(tNow); }
});
resize();
{
  const q = parseFloat(new URLSearchParams(location.search).get('warm'));
  const warm = Number.isFinite(q) ? clamp(q, 0, 60) : 3;
  for (let k = 0, n = Math.round(warm * 30); k < n; k++) {
    tNow += 1 / 30;
    updateAnim(tNow); updateParticles(tNow, 1 / 30); drawRain(tNow, 1 / 30);
  }
  if (nextAuto < tNow + 1.2) nextAuto = tNow + 1.2;
}
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
